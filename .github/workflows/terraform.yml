
name: Terraform AWS CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform AWS Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # 3. Debug GitHub OIDC Claims
      - name: Debug GitHub OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC ISSUER:", payload.iss);
            console.log("OIDC AUDIENCE:", payload.aud);
            console.log("OIDC SUBJECT:", payload.sub);
            console.log("REPOSITORY:", payload.repository);
            console.log("ENVIRONMENT:", payload.environment || "Not set");

      # 4. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsTerraform

      # 5. Verify AWS Authentication
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 6. Terraform Format
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # 7. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 8. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -no-color
