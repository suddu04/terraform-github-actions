
name: Terraform AWS CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # Step 3: Verify Terraform version
      - name: Check Terraform Version
        run: terraform version

      # Step 4: Configure AWS using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsTerraform

      # Step 5: Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 6: Check Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 7: Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Step 8: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 9: Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -input=false -no-color
