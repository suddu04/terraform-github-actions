
name: Terraform AWS CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    environment: production

    defaults:
      run:
        shell: bash

    steps:
      # Step 1: Checkout GitHub Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Step 3: Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # Step 4: Verify AWS Authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 5: Terraform Format Check
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 6: Terraform Initialize
      - name: Terraform Init
        run: terraform init

      # Step 7: Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Step 8: Terraform Plan
      - name: Terraform Plan
        run: terraform plan -no-color
