
name: AWS OIDC Diagnostic

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-diagnostic:
    name: Check OIDC Token
    runs-on: ubuntu-latest

    steps:
      - name: Generate and Inspect OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log("========== OIDC DIAGNOSTIC ==========");
            console.log("ISSUER:", payload.iss);
            console.log("AUDIENCE:", JSON.stringify(payload.aud));
            console.log("SUBJECT:", payload.sub);
            console.log("REPOSITORY:", payload.repository);
            console.log("REF:", payload.ref);
            console.log("OWNER:", payload.repository_owner);
            console.log("=====================================");
